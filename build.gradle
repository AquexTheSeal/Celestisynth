tasks.named('processResources', ProcessResources).configure {
    def props = new Properties()

    file('gradle.properties').withInputStream { props.load(it) }

    // Filter out any non-String values and system properties
    def replaceProperties = [:]

    props.each { key, value ->
        if (value instanceof String) {
            replaceProperties.put(key, value)
        }
    }

    inputs.properties(replaceProperties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties + [project: project]
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'		  	  : "${modid}.mixins.json"
        ])
    }
    finalizedBy("reobfJar")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            group = mod_group
            artifactId = base.archivesName.get()
            version = mod_version

            from components.java
            jarJar.component(it)
        }
    }

    repositories {
        maven {

        }
    }
}

publishMods {
    file = tasks.jarJar.archiveFile
    changelog = file("CHANGELOG.md").getText()
    version = "${mc_version}-${mod_version}"
    displayName = "${mod_name} v${mc_version}-${mod_version}"
    type = STABLE

    modLoaders.add("forge")
    modLoaders.add("neoforge")

    curseforge {
        projectId = "872712"
        projectSlug = "celestisynth"
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        announcementTitle = "New Celestisynth CurseForge Release! [v${mc_version}-${mod_version}]"

        getMinecraftVersions().add(mc_version)
        requires("geckolib")
        requires("playeranimator")
    }

    modrinth {
        projectId = "2ocGk7mG"
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        announcementTitle = "New Celestisynth Modrinth Release! [v${mc_version}-${mod_version}]"

        getMinecraftVersions().add(mc_version)
        requires("geckolib")
        requires("playeranimator")
    }
}


